name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs in brand colours
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#d0112a&color_dots=#ebedf0,#ffc9cf,#ff8a96,#ff2a40,#b40c22
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff2a40&color_dots=#0b2a5c,#5a1a2e,#a0142c,#d0112a,#ff2a40

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
