<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="How we work: Analyse → Design → Build → Grow"><defs>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2a5c"/><stop offset="1" stop-color="#020c1d"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2a40"/><stop offset="1" stop-color="#ff7a2a"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#ff2a40" stop-opacity=".42"/><stop offset="1" stop-color="#ff2a40" stop-opacity="0"/></radialGradient>
<radialGradient id="glowBlue"><stop offset="0" stop-color="#2f6bff" stop-opacity=".32"/><stop offset="1" stop-color="#2f6bff" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".45"/></filter>
<style>
text { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
.float { animation: float 6s ease-in-out infinite; }
.float2 { animation: float 7s ease-in-out 1s infinite; }
.float3 { animation: float 5s ease-in-out 2s infinite; }
.pulse { animation: pulse 5s ease-in-out infinite; }
.rise { animation: rise .8s ease-out both; }
.draw { stroke-dasharray: 600; animation: draw 2.4s .6s ease-out both; }
.flow { animation: flow 1.2s linear infinite; }
.ring { transform-box: fill-box; transform-origin: center; animation: ring 2.8s ease-out infinite; }
@keyframes float { 50% { transform: translateY(-10px); } }
@keyframes pulse { 50% { opacity: .55; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes draw { from { stroke-dashoffset: 600; } to { stroke-dashoffset: 0; } }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes ring { from { transform: scale(1); opacity: .7; } to { transform: scale(1.35); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .float,.float2,.float3,.pulse,.rise,.draw,.flow,.ring { animation: none !important; }
  .ring { opacity: 0; }
}
</style></defs><clipPath id="clip"><rect width="1200" height="400" rx="28"/></clipPath><g clip-path="url(#clip)"><rect width="1200" height="400" fill="url(#card)"/><rect width="1200" height="400" fill="url(#grid)"/><circle class="pulse" cx="1080" cy="40" r="340" fill="url(#glow)"/><circle cx="80" cy="400" r="300" fill="url(#glowBlue)"/></g><rect x=".5" y=".5" width="1199" height="399" rx="28" fill="none" stroke="#fff" stroke-opacity=".08"/><rect x="48" y="67" width="28" height="4" rx="2" fill="url(#accent)"/><text x="88" y="74" font-size="15" font-weight="700" fill="#ff2a40" text-anchor="start" letter-spacing="3">HOW WE WORK</text><text x="48" y="126" font-size="42" font-weight="800" fill="#fff" text-anchor="start" letter-spacing="-1">From idea to revenue.</text><path d="M186 220H1014" stroke="#fff" stroke-opacity=".12" stroke-width="2"/><path class="flow" d="M186 220H1014" stroke="#ff2a40" stroke-width="3" stroke-dasharray="10 26" stroke-linecap="round"/><circle class="ring" style="animation-delay:0.0s" cx="186" cy="220" r="40" fill="none" stroke="#ff2a40" stroke-width="2"/><circle cx="186" cy="220" r="40" fill="#0b2a5c" stroke="url(#accent)" stroke-width="3"/><text x="186" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" >01</text><text x="186" y="300" font-size="24" font-weight="800" fill="#fff" text-anchor="middle" >Analyse</text><text x="186" y="332" font-size="17" font-weight="500" fill="#a9b5cc" text-anchor="middle" >Goals, market &amp;</text><text x="186" y="358" font-size="17" font-weight="500" fill="#a9b5cc" text-anchor="middle" >keyword research</text><circle class="ring" style="animation-delay:0.7s" cx="462" cy="220" r="40" fill="none" stroke="#ff2a40" stroke-width="2"/><circle cx="462" cy="220" r="40" fill="#0b2a5c" stroke="url(#accent)" stroke-width="3"/><text x="462" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" >02</text><text x="462" y="300" font-size="24" font-weight="800" fill="#fff" text-anchor="middle" >Design</text><text x="462" y="332" font-size="17" font-weight="500" fill="#a9b5cc" text-anchor="middle" >UX &amp; a brand that</text><text x="462" y="358" font-size="17" font-weight="500" fill="#a9b5cc" text-anchor="middle" >converts visitors</text><circle class="ring" style="animation-delay:1.4s" cx="738" cy="220" r="40" fill="none" stroke="#ff2a40" stroke-width="2"/><circle cx="738" cy="220" r="40" fill="#0b2a5c" stroke="url(#accent)" stroke-width="3"/><text x="738" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" >03</text><text x="738" y="300" font-size="24" font-weight="800" fill="#fff" text-anchor="middle" >Build</text><text x="738" y="332" font-size="17" font-weight="500" fill="#a9b5cc" text-anchor="middle" >Websites, shops,</text><text x="738" y="358" font-size="17" font-weight="500" fill="#a9b5cc" text-anchor="middle" >apps &amp; software</text><circle class="ring" style="animation-delay:2.1s" cx="1014" cy="220" r="40" fill="none" stroke="#ff2a40" stroke-width="2"/><circle cx="1014" cy="220" r="40" fill="#0b2a5c" stroke="url(#accent)" stroke-width="3"/><text x="1014" y="228" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" >04</text><text x="1014" y="300" font-size="24" font-weight="800" fill="#fff" text-anchor="middle" >Grow</text><text x="1014" y="332" font-size="17" font-weight="500" fill="#a9b5cc" text-anchor="middle" >SEO, ads, data</text><text x="1014" y="358" font-size="17" font-weight="500" fill="#a9b5cc" text-anchor="middle" >&amp; AI that scale</text></svg>