<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="100s of projects delivered, 4.9 Google rating, 6 cities, 1 team. Google Partner, Amazon Ads Verified Partner, JTL Servicepartner."><defs>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2a5c"/><stop offset="1" stop-color="#020c1d"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2a40"/><stop offset="1" stop-color="#ff7a2a"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#ff2a40" stop-opacity=".42"/><stop offset="1" stop-color="#ff2a40" stop-opacity="0"/></radialGradient>
<radialGradient id="glowBlue"><stop offset="0" stop-color="#2f6bff" stop-opacity=".32"/><stop offset="1" stop-color="#2f6bff" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".45"/></filter>
<style>
text { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
.float { animation: float 6s ease-in-out infinite; }
.float2 { animation: float 7s ease-in-out 1s infinite; }
.float3 { animation: float 5s ease-in-out 2s infinite; }
.pulse { animation: pulse 5s ease-in-out infinite; }
.rise { animation: rise .8s ease-out both; }
.draw { stroke-dasharray: 600; animation: draw 2.4s .6s ease-out both; }
.flow { animation: flow 1.2s linear infinite; }
.ring { transform-box: fill-box; transform-origin: center; animation: ring 2.8s ease-out infinite; }
@keyframes float { 50% { transform: translateY(-10px); } }
@keyframes pulse { 50% { opacity: .55; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes draw { from { stroke-dashoffset: 600; } to { stroke-dashoffset: 0; } }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes ring { from { transform: scale(1); opacity: .7; } to { transform: scale(1.35); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .float,.float2,.float3,.pulse,.rise,.draw,.flow,.ring { animation: none !important; }
  .ring { opacity: 0; }
}
</style></defs><clipPath id="clip"><rect width="1200" height="300" rx="28"/></clipPath><g clip-path="url(#clip)"><rect width="1200" height="300" fill="url(#card)"/><rect width="1200" height="300" fill="url(#grid)"/><circle class="pulse" cx="1080" cy="40" r="340" fill="url(#glow)"/><circle cx="80" cy="300" r="300" fill="url(#glowBlue)"/></g><rect x=".5" y=".5" width="1199" height="299" rx="28" fill="none" stroke="#fff" stroke-opacity=".08"/><text x="186.0" y="112" font-size="60" font-weight="800" fill="url(#accent)" text-anchor="middle" letter-spacing="-1">100s</text><text x="186.0" y="150" font-size="18" font-weight="600" fill="#a9b5cc" text-anchor="middle" >projects delivered</text><text x="462.0" y="112" font-size="60" font-weight="800" fill="url(#accent)" text-anchor="middle" letter-spacing="-1">4.9★</text><text x="462.0" y="150" font-size="18" font-weight="600" fill="#a9b5cc" text-anchor="middle" >Google rating</text><text x="738.0" y="112" font-size="60" font-weight="800" fill="url(#accent)" text-anchor="middle" letter-spacing="-1">6</text><text x="738.0" y="150" font-size="18" font-weight="600" fill="#a9b5cc" text-anchor="middle" >cities in Germany</text><text x="1014.0" y="112" font-size="60" font-weight="800" fill="url(#accent)" text-anchor="middle" letter-spacing="-1">1</text><text x="1014.0" y="150" font-size="18" font-weight="600" fill="#a9b5cc" text-anchor="middle" >team for everything</text><path d="M324 62V150" stroke="#fff" stroke-opacity=".1"/><path d="M600 62V150" stroke="#fff" stroke-opacity=".1"/><path d="M876 62V150" stroke="#fff" stroke-opacity=".1"/><path d="M48 192H1152" stroke="#fff" stroke-opacity=".08"/><text x="48" y="256" font-size="15" font-weight="700" fill="#ff2a40" text-anchor="start" letter-spacing="3">CERTIFIED PARTNER</text><rect x="300" y="226" width="207" height="48" rx="24" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/><circle cx="326" cy="250" r="15" fill="#4285F4"/><text x="326" y="256" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >G</text><text x="350" y="256" font-size="18" font-weight="600" fill="#e6ebf5" text-anchor="start" >Google Partner</text><rect x="522.6800000000001" y="226" width="333" height="48" rx="24" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/><circle cx="548.6800000000001" cy="250" r="15" fill="#FF9900"/><text x="548.6800000000001" y="256" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >a</text><text x="572.6800000000001" y="256" font-size="18" font-weight="600" fill="#e6ebf5" text-anchor="start" >Amazon Ads Verified Partner</text><rect x="871.3600000000001" y="226" width="251" height="48" rx="24" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/><circle cx="897.3600000000001" cy="250" r="15" fill="#1E5AA8"/><text x="897.3600000000001" y="256" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >J</text><text x="921.3600000000001" y="256" font-size="18" font-weight="600" fill="#e6ebf5" text-anchor="start" >JTL Servicepartner</text></svg>