<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ready to turn your words into sales? Start your project."><defs>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2a5c"/><stop offset="1" stop-color="#020c1d"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2a40"/><stop offset="1" stop-color="#ff7a2a"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#ff2a40" stop-opacity=".42"/><stop offset="1" stop-color="#ff2a40" stop-opacity="0"/></radialGradient>
<radialGradient id="glowBlue"><stop offset="0" stop-color="#2f6bff" stop-opacity=".32"/><stop offset="1" stop-color="#2f6bff" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".45"/></filter>
<linearGradient id="ctabg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2a40"/><stop offset=".55" stop-color="#d0112a"/><stop offset="1" stop-color="#4a0a2e"/></linearGradient><radialGradient id="ctaglow"><stop offset="0" stop-color="#00285a" stop-opacity=".75"/><stop offset="1" stop-color="#00285a" stop-opacity="0"/></radialGradient><style>
text { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
.float { animation: float 6s ease-in-out infinite; }
.float2 { animation: float 7s ease-in-out 1s infinite; }
.float3 { animation: float 5s ease-in-out 2s infinite; }
.pulse { animation: pulse 5s ease-in-out infinite; }
.rise { animation: rise .8s ease-out both; }
.draw { stroke-dasharray: 600; animation: draw 2.4s .6s ease-out both; }
.flow { animation: flow 1.2s linear infinite; }
.ring { transform-box: fill-box; transform-origin: center; animation: ring 2.8s ease-out infinite; }
@keyframes float { 50% { transform: translateY(-10px); } }
@keyframes pulse { 50% { opacity: .55; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes draw { from { stroke-dashoffset: 600; } to { stroke-dashoffset: 0; } }
@keyframes flow { to { stroke-dashoffset: -36; } }
@keyframes ring { from { transform: scale(1); opacity: .7; } to { transform: scale(1.35); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .float,.float2,.float3,.pulse,.rise,.draw,.flow,.ring { animation: none !important; }
  .ring { opacity: 0; }
}
</style></defs><clipPath id="clip"><rect width="1200" height="320" rx="28"/></clipPath><g clip-path="url(#clip)"><rect width="1200" height="320" fill="url(#ctabg)"/><rect width="1200" height="320" fill="url(#grid)"/><circle cx="990" cy="164" r="120" fill="none" stroke="#fff" stroke-opacity=".1"/><circle cx="990" cy="164" r="190" fill="none" stroke="#fff" stroke-opacity=".1"/><circle cx="990" cy="164" r="260" fill="none" stroke="#fff" stroke-opacity=".1"/><circle cx="990" cy="164" r="330" fill="none" stroke="#fff" stroke-opacity=".1"/><circle cx="1120" cy="320" r="420" fill="url(#ctaglow)"/></g><text x="70" y="132" font-size="48" font-weight="800" fill="#fff" text-anchor="start" letter-spacing="-1">Ready to turn your words</text><text x="70" y="192" font-size="48" font-weight="800" fill="#fff" text-anchor="start" letter-spacing="-1">into sales?</text><text x="70" y="244" font-size="19" font-weight="500" fill="#fff" text-anchor="start" fill-opacity=".85">Fair, transparent pricing · mostly fixed prices · one team</text><rect class="ring" x="850" y="128" width="280" height="72" rx="36" fill="none" stroke="#fff" stroke-width="2"/><rect x="850" y="128" width="280" height="72" rx="36" fill="#fff" filter="url(#shadow)"/><text x="990" y="172" font-size="22" font-weight="800" fill="#00285a" text-anchor="middle" >Start your project  →</text></svg>