<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-label="Let's build something that sells.">
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b40c22"/>
      <stop offset=".5" stop-color="#ff2a40"/>
      <stop offset="1" stop-color="#00285a"/>
    </linearGradient>
    <style>
      .w { animation: wave 8s ease-in-out infinite alternate; }
      @keyframes wave { from { transform: translateX(0) } to { transform: translateX(-60px) } }
      @media (prefers-reduced-motion: reduce) { .w { animation: none } }
    </style>
  </defs>
  <path class="w" d="M0 60 C 200 10, 400 110, 600 60 S 1000 10, 1260 60 V160 H0 Z" fill="url(#f)" opacity=".35"/>
  <path d="M0 80 C 220 40, 380 130, 620 80 S 1000 40, 1200 80 V160 H0 Z" fill="url(#f)"/>
  <text x="600" y="130" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Let’s build something that sells.</text>
</svg>
