<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="List &amp; Sell GmbH — converting words into sales">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00285a"/>
      <stop offset="1" stop-color="#000f24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2a40" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2a40" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2a40"/>
      <stop offset="1" stop-color="#b40c22"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="400" rx="24"/></clipPath>
    <style>
      .t { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 1.2s cubic-bezier(.2,.8,.2,1) both; }
      .b2 { animation-delay: .15s } .b3 { animation-delay: .3s } .b4 { animation-delay: .45s }
      .arrow { stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 1s .7s ease-out forwards; }
      .head { opacity: 0; animation: fade .3s 1.6s forwards; }
      .swing { transform-box: view-box; transform-origin: 582px 146px; animation: swing 4s ease-in-out 1.5s infinite; }
      .pulse { animation: pulse 6s ease-in-out infinite; }
      .rise { opacity: 0; animation: rise .8s ease-out forwards; }
      .d1 { animation-delay: .3s } .d2 { animation-delay: .6s } .d3 { animation-delay: .9s }
      @keyframes grow { from { transform: scaleY(0) } to { transform: scaleY(1) } }
      @keyframes draw { to { stroke-dashoffset: 0 } }
      @keyframes fade { to { opacity: 1 } }
      @keyframes swing { 0%,100% { transform: rotate(0deg) } 50% { transform: rotate(-4deg) } }
      @keyframes pulse { 0%,100% { opacity: .7 } 50% { opacity: 1 } }
      @keyframes rise { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
      @media (prefers-reduced-motion: reduce) {
        .bar, .arrow, .head, .swing, .pulse, .rise { animation: none; opacity: 1; stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <circle class="pulse" cx="1060" cy="60" r="320" fill="url(#glow)"/>
    <circle class="pulse" cx="120" cy="420" r="220" fill="url(#glow)" opacity=".5"/>
    <rect y="392" width="1200" height="8" fill="#d0112a"/>
  </g>

  <!-- growth chart (from the logo) -->
  <g transform="translate(80 110)">
    <rect class="bar b1" x="0"   y="130" width="32" height="70"  rx="5" fill="#d0112a"/>
    <rect class="bar b2" x="44"  y="95"  width="32" height="105" rx="5" fill="#ff6a2a"/>
    <rect class="bar b3" x="88"  y="60"  width="32" height="140" rx="5" fill="#fbbc05"/>
    <rect class="bar b4" x="132" y="20"  width="32" height="180" rx="5" fill="#34c759"/>
    <path class="arrow" d="M-6 150 C 50 120, 110 70, 178 -8" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <path class="head" d="M162 -14 L186 -18 L184 6 Z" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text class="t rise" x="300" y="210" font-size="104" font-weight="800" fill="#ffffff" letter-spacing="-2">List <tspan fill="#ff2a40">&amp;</tspan></text>

  <!-- price tag -->
  <g class="swing">
    <path d="M582 146 Q615 140 649 181" fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="3"/>
    <g transform="rotate(-12 700 170)">
      <path d="M620 135 L660 110 H850 Q862 110 862 122 V218 Q862 230 850 230 H660 L620 205 Z" fill="url(#tag)"/>
      <circle cx="648" cy="170" r="9" fill="#00285a"/>
      <text class="t" x="757" y="194" font-size="66" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">S€LL</text>
    </g>
  </g>

  <text class="t rise d1" x="304" y="268" font-size="30" font-weight="600" fill="#e8ecf4">converting words into sales</text>

  <g class="t rise d2" font-size="17" font-weight="600" fill="#ffffff">
    <rect x="304" y="298" width="128" height="36" rx="18" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".2"/>
    <text x="368" y="322" text-anchor="middle">Web Design</text>
    <rect x="442" y="298" width="70" height="36" rx="18" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".2"/>
    <text x="477" y="322" text-anchor="middle">SEO</text>
    <rect x="522" y="298" width="128" height="36" rx="18" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".2"/>
    <text x="586" y="322" text-anchor="middle">E-Commerce</text>
    <rect x="660" y="298" width="76" height="36" rx="18" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".2"/>
    <text x="698" y="322" text-anchor="middle">Apps</text>
    <rect x="746" y="298" width="104" height="36" rx="18" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".2"/>
    <text x="798" y="322" text-anchor="middle">Software</text>
    <rect x="860" y="298" width="60" height="36" rx="18" fill="#d0112a"/>
    <text x="890" y="322" text-anchor="middle">AI</text>
  </g>

  <!-- rating badge -->
  <g class="t rise d3">
    <rect x="958" y="40" width="200" height="64" rx="14" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/>
    <text x="978" y="68" font-size="15" fill="#c9d2e3">Google rating</text>
    <text x="978" y="92" font-size="20" font-weight="800" fill="#fbbc05">★★★★★ <tspan fill="#ffffff">4.9</tspan></text>
    <text x="1158" y="370" font-size="16" font-weight="600" fill="#c9d2e3" text-anchor="end">Berlin · München · Hamburg · Düsseldorf · Frankfurt · Potsdam</text>
  </g>
</svg>
